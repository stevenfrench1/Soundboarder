[build]
  publish = "."

# Always check for a new service worker / app shell so updates reach devices.
# Online sound search. The app downloads search results directly when the
# host allows it; these same-origin rewrites are the fallback for hosts that
# don't send CORS headers. Only these four hosts are reachable, read-only.
[[redirects]]
  from = "/sfx/openverse/*"
  to = "https://api.openverse.org/:splat"
  status = 200
[[redirects]]
  from = "/sfx/freesound-cdn/*"
  to = "https://cdn.freesound.org/:splat"
  status = 200
[[redirects]]
  from = "/sfx/freesound/*"
  to = "https://freesound.org/:splat"
  status = 200
[[redirects]]
  from = "/sfx/wikimedia/*"
  to = "https://upload.wikimedia.org/:splat"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.openverse.org https://cdn.freesound.org https://freesound.org https://upload.wikimedia.org; media-src 'self' blob: data:; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
